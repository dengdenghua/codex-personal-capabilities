name: Validate portable capabilities
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests
      - run: python -B -m unittest discover -s plugins/optics-workbench/server/tests
        env:
          PYTHONPATH: plugins/optics-workbench/server
      - run: python scripts/validate.py --tracked
